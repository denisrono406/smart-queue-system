<div style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto;">
    <h2 style="color: #1a365d;">Password Reset Request</h2>
    <p>Hello {{ user.full_name }},</p>
    <p>You requested a password reset. Click the button below to set a new password:</p>
    <a href="{{ reset_url }}" style="display: inline-block; padding: 12px 24px; background-color: #2563eb; color: white; text-decoration: none; border-radius: 6px; font-weight: bold;">Reset Password</a>
    <p style="margin-top: 20px; color: #666; font-size: 14px;">This link expires in 1 hour. If you didn't request this, you can safely ignore this email.</p>
</div>
